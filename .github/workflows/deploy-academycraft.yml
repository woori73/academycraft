name: Deploy AcademyCraft (manual)

# 신규 AWS 425805163960 전용. 구 AWS·BuildIt DB·BuildIt 서비스 변경 금지.
# production 환경: main만 배포, woori73 승인, 관리자 우회 비활성화.
# 신규 EC2/RDS/호스트 내부 환경 파일 리소스를 생성하지 않는다.
# 전용 배포 IAM 역할·기존 ALB host 규칙·백업 prefix 권한은 사전 준비 필요.
# DB 관리자 자격증명은 신규 호스트 /etc/f2r/env에서만 일시적으로 읽는다.
# 앱에는 별도 academycraft DB 사용자·스키마와 자체 JWT 비밀키만 전달한다.
# 최초 배포 전용: 기존 JAR가 있으면 중단. 실패 시 AcademyCraft만 정지하고
# 전용 DB·환경·백업 파일은 보존한다. 운영 DB 삭제·초기화·재이전 없음.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'inspect=소속 읽기 전용 확인, update=기존 배포 업데이트, initial=최초 설치'
        required: true
        default: inspect
        type: choice
        options: [inspect, update, initial]
      existing_command_id:
        description: '기존 SSM 명령 결과만 조회 (새 서버 작업 실행 안 함)'
        required: false
        type: string
      bindings_json:
        description: 'update 전용: 검토·승인된 기존 소속 JSON 배열 (비밀값 금지)'
        required: false
        default: '[]'
        type: string
      confirm:
        description: '배포 확인 문구. 정확히 DEPLOY 를 입력해야 실행됩니다'
        required: true
        type: string
      manual_checks:
        description: '수동 사전점검 완료 확인. MySQL 연결 수·ALB 규칙을 직접 확인 후 정확히 CHECKED 를 입력하세요'
        required: true
        type: string
      deploy_sha:
        description: '배포할 커밋 SHA (비우면 실행 시점의 main HEAD)'
        required: false
        type: string
      backup_bucket:
        description: '백업 S3 목적지 (예: s3://f2r-deploy-425805163960/backups/academycraft/). 필수 입력'
        required: true
        type: string

permissions:
  id-token: write # AWS OIDC
  contents: read

# 동시에 두 배포가 같은 EC2·DB·systemd 유닛을 건드리지 않게 직렬화.
# 진행 중 배포를 취소하지 않는다 (절반 적용 상태 방지).
concurrency:
  group: academycraft-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EC2_INSTANCE_ID: i-0414de33d2803c723
  # AcademyCraft 전용 IAM 역할 (BuildIt 역할과 분리)
  # 실제 생성 전에는 배포 실행 불가
  DEPLOY_ROLE_ARN: arn:aws:iam::425805163960:role/github-actions-academycraft-deploy
  DEPLOY_S3_PREFIX: s3://f2r-deploy-425805163960/academycraft
  APP_PORT: 8082
  # 원격 호스트 내부에서만 읽는 기존 관리자 환경 파일 (앱으로 복사하지 않음)
  DB_ADMIN_ENV_FILE: /etc/f2r/env

jobs:
  # ------------------------------------------------------------------
  # 0. 가드: 확인 문구 + SHA 유효성 (AWS 없이 실행 가능)
  # ------------------------------------------------------------------
  guard:
    name: 확인 문구·SHA 검증
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: 확인 문구 검사
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          MANUAL_CHECKS: ${{ inputs.manual_checks }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = inspect ]; then
            [ "$CONFIRM" = INSPECT ] || exit 1
            exit 0
          fi
          [ "$OPERATION" = update ] || [ "$OPERATION" = initial ] || exit 1
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::배포 확인 문구가 일치하지 않습니다. 실행을 중단합니다."
            exit 1
          fi
          echo "확인 문구 통과"
          # 수동 사전점검 완료 확인 (워크플로우에서 자동 검증 불가 항목)
          # - MySQL: max_connections, Threads_connected, Max_used_connections 직접 조회
          # - ALB: 리스너 규칙·우선순위 충돌 여부 콘솔 확인
          if [ "$MANUAL_CHECKS" != "CHECKED" ]; then
            echo "::error::수동 사전점검 미완료. 다음을 직접 확인 후 CHECKED를 입력하세요:"
            echo "::error::  1. MySQL: SHOW STATUS LIKE 'Threads_connected', SHOW VARIABLES LIKE 'max_connections'"
            echo "::error::  2. ALB: academy.feel2real.co.kr 리스너 규칙 우선순위 충돌 없음"
            exit 1
          fi
          echo "수동 사전점검 완료 확인"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SHA 결정·검증
        id: resolve
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.deploy_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA:-$DISPATCH_SHA}"
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::40자리 커밋 SHA가 아닙니다: $SHA"
            exit 1
          fi
          if ! git cat-file -e "$SHA^{commit}" 2>/dev/null; then
            echo "::error::저장소에 존재하지 않는 커밋입니다: $SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::main 계보가 아닌 커밋입니다: $SHA"
            exit 1
          fi
          echo "배포 SHA: $SHA ($(git log -1 --format=%s "$SHA"))"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # 1. 사전점검: EC2 리소스·기존 서비스·S3 쓰기 권한 (읽기 전용, 기준 미달 시 중단)
  #    7개 항목 모두 통과해야 다음 단계 진행
  # ------------------------------------------------------------------
  precheck:
    if: inputs.operation == 'initial'
    name: 배포 직전 사전점검 (7개 항목)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 신규 AWS 계정 강제 확인
        shell: bash
        run: |
          set -euo pipefail
          [ "$(aws sts get-caller-identity --query Account --output text)" = "425805163960" ]

      - name: EC2 사전점검 (SSM, 읽기 전용)
        shell: bash
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["set -euo pipefail","AVAIL_MB=$(free -m | awk \"/^Mem:/{print \\$7}\")","echo \"available: ${AVAIL_MB}MB\"","[ \"$AVAIL_MB\" -ge 1500 ] || { echo \"ABORT: 가용 메모리 ${AVAIL_MB}MB < 1500MB\"; exit 1; }","DISK_KB=$(df / | awk \"NR==2{print \\$4}\")","echo \"disk_avail_kb: ${DISK_KB}\"","[ \"$DISK_KB\" -ge 2097152 ] || { echo \"ABORT: 루트 디스크 여유 2GB 미만\"; exit 1; }","uptime","systemctl is-active f2r-app || { echo \"ABORT: f2r-app 비정상\"; exit 1; }","systemctl is-active buildit-wiki || { echo \"ABORT: buildit-wiki 비정상\"; exit 1; }","curl -fsS --max-time 10 https://feel2real.co.kr/ -o /dev/null -w \"main_site:%{http_code}\\n\"","echo \"PRECHECK OK\""]}' \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          STATUS=""
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" --output json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("StandardOutputContent","")); print("STDERR:", d.get("StandardErrorContent",""))'
          if [ "$STATUS" != "Success" ]; then
            echo "::error::사전점검 실패 (Status=$STATUS). 기준 미달 또는 서비스 비정상이면 배포를 중단합니다."
            exit 1
          fi
          echo "사전점검 통과"

      - name: S3 백업 쓰기 권한 확인 (GitHub Actions 역할)
        shell: bash
        env:
          BACKUP_BUCKET: ${{ inputs.backup_bucket }}
        run: |
          set -euo pipefail
          # 승인된 백업 prefix와 일치하는지 검증 (임의 버킷 방지)
          APPROVED_PREFIX="s3://f2r-deploy-425805163960/backups/academycraft/"
          if [ "$BACKUP_BUCKET" != "$APPROVED_PREFIX" ]; then
            echo "::error::backup_bucket이 승인된 prefix와 일치하지 않습니다."
            echo "::error::입력: $BACKUP_BUCKET"
            echo "::error::승인된 prefix: $APPROVED_PREFIX"
            echo "::error::임의 버킷 지정은 허용되지 않습니다."
            exit 1
          fi
          # backup_bucket 형식 검증 (s3://bucket/prefix)
          if ! printf '%s' "$BACKUP_BUCKET" | grep -Eq '^s3://[a-z0-9.-]+/.+'; then
            echo "::error::backup_bucket 형식이 올바르지 않습니다: $BACKUP_BUCKET"
            exit 1
          fi
          # GitHub Actions 역할의 쓰기 권한 테스트 (배포 아티팩트 업로드용)
          TEST_KEY="${BACKUP_BUCKET%/}/.write-test-$(date +%s)"
          echo "write-test" | aws s3 cp - "$TEST_KEY"
          aws s3 rm "$TEST_KEY"
          echo "GitHub Actions S3 쓰기 권한 확인: $BACKUP_BUCKET"

      - name: S3 백업 쓰기 권한 확인 (EC2 인스턴스 프로파일)
        shell: bash
        env:
          BACKUP_BUCKET: ${{ inputs.backup_bucket }}
        run: |
          set -euo pipefail
          # 실제 백업은 EC2 인스턴스 프로파일로 실행되므로,
          # EC2에서 해당 S3 prefix에 PutObject 권한이 있는지 SSM으로 검증
          # GitHub Actions 역할의 권한만으로는 검증 완료 처리하지 않음
          Q() { printf '%q' "$1"; }
          CMD="TEST_KEY=$(Q "${BACKUP_BUCKET%/}")/.ec2-write-test-$(date +%s); "
          CMD="$CMD""echo ec2-write-test | aws s3 cp - \"\$TEST_KEY\" && aws s3 rm \"\$TEST_KEY\" && echo 'EC2 S3 WRITE OK' || { echo 'ABORT: EC2 인스턴스 프로파일에 S3 쓰기 권한 없음'; exit 1; }"
          python3 - "$CMD" <<'PYEOF' > /tmp/ssm-s3test.json
          import json, sys
          print(json.dumps({"commands": [sys.argv[1]]}))
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-s3test.json \
            --query 'Command.CommandId' --output text)
          shred -u /tmp/ssm-s3test.json
          STATUS=""
          for _ in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query 'StandardOutputContent' --output text)
          echo "$OUT"
          if [ "$STATUS" != "Success" ] || ! echo "$OUT" | grep -q "EC2 S3 WRITE OK"; then
            echo "::error::EC2 인스턴스 프로파일의 S3 쓰기 권한 검증 실패"
            echo "::error::인스턴스 프로파일에 s3:PutObject/s3:DeleteObject 권한이 필요합니다"
            exit 1
          fi
          echo "EC2 인스턴스 프로파일 S3 쓰기 권한 확인 완료"

  # ------------------------------------------------------------------
  # 2. 빌드: 프론트엔드 JAR 내장 + 패키징 + S3 업로드
  #    precheck 완료 후에만 실행 (S3 업로드 순서 보장)
  # ------------------------------------------------------------------
  build:
    if: inputs.operation == 'initial'
    name: JAR 빌드·검증·업로드
    needs: [guard, precheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # S3 업로드에 AWS OIDC를 사용하므로 environment 를 지정해야
    # OIDC subject 가 repo:woori73@299170593/academycraft@1421088210:environment:production 이 된다.
    environment: production
    steps:
      - name: Checkout (배포 SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 프론트엔드 JAR 내장
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/src/main/resources/static
          cp -r frontend/* backend/src/main/resources/static/
          echo "static 파일 수: $(find backend/src/main/resources/static -type f | wc -l)"

      - name: 패키징 (테스트 스킵 — CI에서 이미 검증)
        run: mvn -B package -DskipTests

      - name: JAR 내용 검증
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(ls target/academycraft-*.jar | head -1)
          echo "JAR: $JAR"
          unzip -l "$JAR" | grep -q "BOOT-INF/classes/static/screens/" \
            || { echo "::error::프론트엔드가 JAR에 내장되지 않았습니다"; exit 1; }
          unzip -l "$JAR" | grep -q "BOOT-INF/classes/db/migration/V1__" \
            || { echo "::error::Flyway 마이그레이션이 JAR에 없습니다"; exit 1; }
          unzip -l "$JAR" | grep -q "BOOT-INF/classes/db/migration/V3__" \
            || { echo "::error::V3 마이그레이션이 JAR에 없습니다"; exit 1; }
          echo "JAR 검증 통과"

      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 신규 AWS 계정 강제 확인
        shell: bash
        run: |
          set -euo pipefail
          [ "$(aws sts get-caller-identity --query Account --output text)" = "425805163960" ]

      - name: JAR를 S3에 업로드
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(ls target/academycraft-*.jar | head -1)
          aws s3 cp "$JAR" "$DEPLOY_S3_PREFIX/academycraft.jar"
          echo "업로드 완료: $DEPLOY_S3_PREFIX/academycraft.jar"

  # ------------------------------------------------------------------
  # 3. 배포: EC2에 계정·시크릿·DB·systemd·JAR 설치 및 기동 (SSM)
  #    DB 관리자 비밀번호는 GitHub에 없음 — EC2가 호스트 내부 환경 파일에서 직접 조회
  # ------------------------------------------------------------------
  deploy:
    if: inputs.operation == 'initial'
    name: EC2 배포 실행
    needs: [guard, precheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 신규 AWS 계정 강제 확인
        shell: bash
        run: |
          set -euo pipefail
          [ "$(aws sts get-caller-identity --query Account --output text)" = "425805163960" ]

      - name: 배포 스크립트 작성·S3 업로드
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/academycraft-deploy.sh <<'SCRIPT_EOF'
          #!/bin/bash
          # AcademyCraft 최초 배포 — EC2(root) 실행 스크립트. SSM 경유.
          # - DB 관리자 비밀번호는 GitHub·SSM 명령에 포함하지 않는다.
          #   EC2 인스턴스 프로파일이 호스트 내부 환경 파일에서 직접 조회한다.
          # - MySQL 비밀번호는 명령행에 노출하지 않는다 (임시 my.cnf, 600, shred).
          # - /etc/academycraft/env 가 이미 있으면 시크릿을 재생성하지 않는다.
          set -euo pipefail
          : "${APP_PORT:?APP_PORT 미설정}"
          : "${DEPLOY_S3_PREFIX:?DEPLOY_S3_PREFIX 미설정}"
          : "${DB_ADMIN_ENV_FILE:?DB_ADMIN_ENV_FILE 미설정}"
          [ "$DB_ADMIN_ENV_FILE" = /etc/f2r/env ] || exit 1
          BACKUP_BUCKET="${BACKUP_BUCKET:?BACKUP_BUCKET 미설정}"

          log() { echo "[$(date -Iseconds)] $*"; }
          abort() { log "ABORT: $*"; exit 1; }

          log "== 0. 배포 전 기존 서비스 상태 =="
          systemctl is-active --quiet f2r-app || abort "f2r-app 비정상 — 배포 중단"
          systemctl is-active --quiet buildit-wiki || abort "buildit-wiki 비정상 — 배포 중단"
          [ ! -e /opt/academycraft/academycraft.jar ] || abort "최초 배포 전용: 기존 AcademyCraft JAR 발견 — 별도 업데이트·롤백 계획 필요"
          log "f2r-app, buildit-wiki 정상"

          log "== 1. 전용 계정·디렉터리 =="
          if id academycraft >/dev/null 2>&1; then
            log "academycraft 계정 존재 — 유지"
          else
            useradd --system --no-create-home --shell /usr/sbin/nologin academycraft
            log "academycraft 계정 생성"
          fi
          mkdir -p /opt/academycraft /var/log/academycraft /backup/academycraft /etc/academycraft
          chown academycraft:academycraft /opt/academycraft /var/log/academycraft
          chown root:academycraft /backup/academycraft
          chmod 750 /opt/academycraft /var/log/academycraft
          chmod 770 /backup/academycraft

          log "== 2. DB 관리자 자격증명 조회 (호스트 내부 환경 파일, EC2 내부) =="
          # 값은 stdout/log/SSM 인자에 출력하지 않는다. JSON은 셸 메모리에만 유지한다.
          read_db_admin_json() {
            python3 - <<'ADMIN_PY'
          import json,shlex,hashlib,os
          data={}
          for line in open('/etc/f2r/env'):
              line=line.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              key,value=line.split('=',1)
              if key in ('DB_HOST','DB_USER','DB_USERNAME','DB_PASSWORD'):
                  parts=shlex.split(value); data[key]=parts[0] if parts else ''
          result={'host':data.get('DB_HOST'), 'username':data.get('DB_USER') or data.get('DB_USERNAME'), 'password':data.get('DB_PASSWORD')}
          if not all(result.values()): raise SystemExit('Required DB admin fields missing')
          allowed=os.environ.get('ALLOWED_DB_HOST_HASHES','').split(',')
          if hashlib.sha256(result['host'].encode()).hexdigest() not in allowed: raise SystemExit('DB host is not a verified new-account RDS endpoint')
          print(json.dumps(result))
          ADMIN_PY
          }
          DB_SECRET_JSON=$(read_db_admin_json) || abort "관리자 환경 파일 읽기 실패"
          DB_HOST=$(printf '%s' "$DB_SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["host"])')
          DB_ADMIN_USER=$(printf '%s' "$DB_SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["username"])')
          DB_ADMIN_PASSWORD=$(printf '%s' "$DB_SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')
          unset DB_SECRET_JSON
          [ -n "$DB_HOST" ] && [ -n "$DB_ADMIN_USER" ] && [ -n "$DB_ADMIN_PASSWORD" ] \
            || abort "호스트 내부 환경 파일에서 DB 자격증명을 가져오지 못했습니다"
          log "DB 관리자 자격증명 조회 완료 (값은 출력하지 않음)"

          # MySQL 임시 설정 파일 (명령행 비밀번호 노출 방지)
          # 600 권한, 사용 후 shred로 안전 삭제
          make_mycnf() {
            local cnf
            cnf=$(mktemp)
            chmod 600 "$cnf"
            cat > "$cnf" <<EOF
          [client]
          host=$DB_HOST
          user=$DB_ADMIN_USER
          password=$DB_ADMIN_PASSWORD
          connect-timeout=10
          EOF
            printf '%s' "$cnf"
          }
          cleanup_mycnf() {
            [ -n "${MYCNF:-}" ] && [ -f "$MYCNF" ] && shred -u "$MYCNF"
            unset MYCNF DB_ADMIN_PASSWORD
          }
          trap cleanup_mycnf EXIT

          log "== 3. 시크릿·환경 파일 =="
          if [ -f /etc/academycraft/env ]; then
            log "/etc/academycraft/env 존재 — 시크릿 재생성 안 함 (기존 토큰·DB비밀번호 유지)"
          else
            JWT_SECRET=$(openssl rand -base64 48)
            DB_PASSWORD=$(openssl rand -base64 24)
            umask 077
            cat > /etc/academycraft/env <<EOF
          REA_JWT_SECRET=${JWT_SECRET}
          DB_URL=jdbc:mysql://${DB_HOST}:3306/academycraft?serverTimezone=Asia/Seoul
          DB_USERNAME=academycraft
          DB_PASSWORD=${DB_PASSWORD}
          DB_POOL_SIZE=8
          REA_NOTIFICATION_SMS_ENABLED=false
          REA_NOTIFICATION_EMAIL_ENABLED=false
          REA_NOTIFICATION_RESET_BASE_URL=https://academy.feel2real.co.kr
          EOF
            chown root:root /etc/academycraft/env
            chmod 600 /etc/academycraft/env
            log "/etc/academycraft/env 생성 (600, root 소유)"
            unset JWT_SECRET
          fi
          # 배포 스크립트에서 앱 DB 비밀번호 읽기 (MySQL 계정 생성용)
          # shellcheck disable=SC1091
          set -a; . /etc/academycraft/env; set +a
          [ -n "${DB_PASSWORD:-}" ] || abort "/etc/academycraft/env 에서 DB_PASSWORD를 읽지 못했습니다"

          log "== 4. MySQL 스키마·계정 (최소 권한) =="
          command -v mysql >/dev/null 2>&1 || abort "mysql 클라이언트 없음"
          # DB 접속 원본 호스트 판정: DB_HOST 가 로컬이면 localhost, 아니면 EC2 사설 IP
          EC2_IP=$(hostname -I | awk '{print $1}')
          case "$DB_HOST" in
            localhost|127.0.0.1) DB_USER_HOST="localhost" ;;
            *) DB_USER_HOST="$EC2_IP" ;;
          esac
          log "DB_USER_HOST=$DB_USER_HOST (EC2_IP=$EC2_IP)"
          MYCNF=$(make_mycnf)
          mysql --defaults-extra-file="$MYCNF" -e "SELECT 1" >/dev/null 2>&1 \
            || abort "DB 관리자 접속 실패"

          # 기존 DB 존재 시 보호: 데이터 손상 방지
          DB_EXISTS=$(mysql --defaults-extra-file="$MYCNF" -N -e "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='academycraft';")
          if [ "$DB_EXISTS" = "1" ]; then
            TABLE_COUNT=$(mysql --defaults-extra-file="$MYCNF" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='academycraft';")
            FLYWAY_EXISTS=$(mysql --defaults-extra-file="$MYCNF" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='academycraft' AND table_name='flyway_schema_history';")
            log "기존 academycraft DB 발견: 테이블 ${TABLE_COUNT}개, flyway_history=${FLYWAY_EXISTS}"
            if [ "$TABLE_COUNT" -gt 0 ] && [ "$FLYWAY_EXISTS" = "0" ]; then
              abort "기존 DB에 테이블은 있지만 flyway_schema_history가 없습니다. 수동 확인 필요 — 배포 중단"
            fi
            if [ "$TABLE_COUNT" -gt 0 ]; then
              log "기존 데이터 존재 — 스키마 재생성하지 않음, 계정만 확인"
              # 기존 DB가 있으면 CREATE DATABASE는 스킵, 사용자 존재 여부만 확인
              USER_EXISTS=$(mysql --defaults-extra-file="$MYCNF" -N -e "SELECT COUNT(*) FROM mysql.user WHERE user='academycraft' AND host='$DB_USER_HOST';")
              if [ "$USER_EXISTS" = "0" ]; then
                abort "DB는 존재하지만 academycraft 사용자가 없습니다. 수동 확인 필요 — 배포 중단"
              fi
              log "기존 DB·사용자 확인 완료 — 비밀번호 변경하지 않음"
              # 기존 환경에서는 비밀번호를 변경하지 않는다 (데이터 접근 보장)
              # /etc/academycraft/env의 기존 비밀번호를 그대로 사용
              cleanup_mycnf
              trap - EXIT
              # 아래 스키마 생성 블록을 건너뛰기 위해 플래그 설정
              SKIP_SCHEMA_CREATE=1
            fi
          fi

          if [ "${SKIP_SCHEMA_CREATE:-0}" != "1" ]; then
          # 앱 DB 비밀번호를 안전하게 이스케이프 (특수문자 대응)
          ESCAPED_DB_PASSWORD=$(printf '%s' "$DB_PASSWORD" | sed "s/'/''/g")
          mysql --defaults-extra-file="$MYCNF" <<EOSQL
          CREATE DATABASE IF NOT EXISTS academycraft CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER IF NOT EXISTS 'academycraft'@'$DB_USER_HOST' IDENTIFIED BY '$ESCAPED_DB_PASSWORD';
          ALTER USER 'academycraft'@'$DB_USER_HOST' IDENTIFIED BY '$ESCAPED_DB_PASSWORD';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP, REFERENCES,
                CREATE TEMPORARY TABLES, LOCK TABLES, EXECUTE
            ON academycraft.* TO 'academycraft'@'$DB_USER_HOST';
          FLUSH PRIVILEGES;
          EOSQL
          unset ESCAPED_DB_PASSWORD
          log "스키마·계정 준비 완료"
          fi
          # 관리자 비밀번호는 여기서 폐기 (이후 단계에서 불필요)
          cleanup_mycnf
          trap - EXIT

          log "== 5. systemd 유닛 =="
          cat > /etc/systemd/system/academycraft.service <<EOF
          [Unit]
          Description=AcademyCraft
          After=network.target

          [Service]
          Type=simple
          User=academycraft
          Group=academycraft
          WorkingDirectory=/opt/academycraft
          EnvironmentFile=/etc/academycraft/env
          ExecStart=/usr/bin/java -Xms128m -Xmx768m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -Xss512k -jar /opt/academycraft/academycraft.jar --spring.profiles.active=prod --server.port=${APP_PORT} --server.tomcat.threads.max=40
          StandardOutput=append:/var/log/academycraft/app.log
          StandardError=append:/var/log/academycraft/app.log
          Restart=on-failure
          RestartSec=10
          MemoryHigh=1100M
          MemoryMax=1280M
          CPUQuota=50%

          [Install]
          WantedBy=multi-user.target
          EOF
          chmod 644 /etc/systemd/system/academycraft.service
          systemctl daemon-reload
          log "academycraft.service 등록 (포트 ${APP_PORT}, MemoryMax=1280M, CPUQuota=50%)"

          log "== 6. JAR 설치 =="
          aws s3 cp "$DEPLOY_S3_PREFIX/academycraft.jar" /opt/academycraft/academycraft.jar
          chown academycraft:academycraft /opt/academycraft/academycraft.jar
          chmod 640 /opt/academycraft/academycraft.jar
          log "JAR 설치 완료"

          log "== 6-1. 배포 중 리소스 감시 =="
          # JAR 설치 후 메모리 상태 확인 (배포 중 BuildIt·Wiki 영향 감시)
          AVAIL_MB=$(free -m | awk "/^Mem:/{print \$7}")
          log "배포 중 가용 메모리: ${AVAIL_MB}MB"
          if [ "$AVAIL_MB" -lt 800 ]; then
            abort "배포 중 가용 메모리 ${AVAIL_MB}MB < 800MB — BuildIt·Wiki 영향 우려, 배포 중단"
          fi
          # BuildIt·Wiki가 여전히 정상인지 확인
          systemctl is-active --quiet f2r-app || abort "배포 중 f2r-app 비정상 감지 — AcademyCraft 작업 중단"
          systemctl is-active --quiet buildit-wiki || abort "배포 중 buildit-wiki 비정상 감지 — AcademyCraft 작업 중단"
          log "배포 중 감시 통과: 메모리 ${AVAIL_MB}MB, f2r-app·buildit-wiki 정상"

          log "== 7. 기동 (Flyway V1→V3 자동 적용) =="
          # 기동 실패 시에도 AcademyCraft만 정지 (BuildIt·Wiki는 절대 건드리지 않음)
          # trap을 systemctl 실행 전에 등록하여 기동 명령 자체가 실패해도 정리됨
          # abort()는 exit 1만 수행하며, 이 trap이 academycraft만 정리한다
          # 성공 종료(exit 0) 시에는 서비스를 정지하지 않는다
          cleanup_academycraft_on_fail() {
            local exit_code=$?
            if [ $exit_code -ne 0 ]; then
              log "배포 실패 (exit=$exit_code) — academycraft 서비스 정지 (BuildIt·Wiki는 유지)"
              systemctl stop academycraft 2>/dev/null || true
              systemctl disable academycraft 2>/dev/null || true
            else
              log "배포 성공 — academycraft 서비스 유지 (정지하지 않음)"
            fi
            # f2r-app·buildit-wiki는 절대 건드리지 않는다 (명시적)
          }
          # 전체 배포 스크립트가 성공적으로 완료될 때까지 trap 유지
          # (기동 실패·백업 실패·복원 검증 실패 시에도 AcademyCraft를 정지하기 위함)
          trap cleanup_academycraft_on_fail EXIT
          systemctl enable --now academycraft
          log "academycraft.service 기동 요청"

          # health UP 전에는 백업·복원 검증을 시작하지 않는다.
          HEALTHY=false
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 "http://127.0.0.1:${APP_PORT}/actuator/health" >/dev/null; then HEALTHY=true; break; fi
            systemctl is-active --quiet f2r-app || abort "BuildIt 비정상 — AcademyCraft만 중단"
            [ "$(free -m | awk '/^Mem:/{print $7}')" -ge 700 ] || abort "가용 메모리 700MB 미만"
            sleep 3
          done
          [ "$HEALTHY" = true ] || abort "AcademyCraft health 시간초과"
          # 기동 후 리소스 재확인
          AVAIL_AFTER=$(free -m | awk "/^Mem:/{print \$7}")
          log "기동 후 가용 메모리: ${AVAIL_AFTER}MB"
          [ "$AVAIL_AFTER" -ge 700 ] || abort "기동 후 메모리 여유 700MB 미만"
          systemctl is-active --quiet f2r-app || abort "기동 후 f2r-app 비정상 — AcademyCraft 정지 후 수동 롤백 필요"
          systemctl is-active --quiet buildit-wiki || abort "기동 후 buildit-wiki 비정상 — AcademyCraft 정지 후 수동 롤백 필요"
          log "기동 후 감시 통과"
          # trap은 해제하지 않는다 — 백업·복원 검증까지 유지

          log "== 8. 백업 cron (필수) =="
          cat > /etc/cron.daily/academycraft-backup <<EOF
          #!/bin/bash
          set -euo pipefail
          DATE=\$(date +%F-%H%M%S)-\$\$
          BACKUP_DIR=/backup/academycraft
          S3_BUCKET="$BACKUP_BUCKET"
          set -a; . /etc/academycraft/env; set +a
          # MYSQL_PWD 환경변수로 비밀번호 전달 (명령행 노출 방지)
          if ! MYSQL_PWD="\$DB_PASSWORD" mysqldump -h "$DB_HOST" -u "\$DB_USERNAME" \\
            --single-transaction --no-tablespaces --routines academycraft \\
            | gzip > "\$BACKUP_DIR/academycraft-\$DATE.sql.gz"; then
            rm -f "\$BACKUP_DIR/academycraft-\$DATE.sql.gz"
            echo "AcademyCraft dump failed; backup aborted." >&2
            exit 1
          fi
          unset MYSQL_PWD
          gzip -t "\$BACKUP_DIR/academycraft-\$DATE.sql.gz" || exit 1
          if aws s3 cp "\$BACKUP_DIR/academycraft-\$DATE.sql.gz" "\$S3_BUCKET/"; then
            echo "\$(date -Iseconds) BACKUP OK: academycraft-\$DATE.sql.gz" >> /var/log/academycraft/backup.log
          else
            echo "\$(date -Iseconds) BACKUP FAIL: S3 upload" >> /var/log/academycraft/backup.log
            exit 1
          fi
          find "\$BACKUP_DIR" -name "academycraft-*.sql.gz" -mtime +7 -delete
          EOF
          chmod 700 /etc/cron.daily/academycraft-backup
          chown root:root /etc/cron.daily/academycraft-backup
          log "백업 cron 설치: $BACKUP_BUCKET"

          log "== 9. 백업 즉시 검증 =="
          # 배포 직후 첫 백업을 즉시 실행하여 S3 업로드·복원 가능성을 검증
          /etc/cron.daily/academycraft-backup \
            || abort "초기 백업 실패 — S3 업로드를 확인하세요"
          LATEST_BACKUP=$(ls -t /backup/academycraft/academycraft-*.sql.gz | head -1)
          log "백업 검증 완료: $LATEST_BACKUP"

          log "== 10. 격리 복원 검증 (운영 DB에 복원하지 않음) =="
          # 백업 파일이 실제로 복원 가능한지 격리된 임시 DB에서 검증
          # 운영 academycraft DB에는 절대 복원하지 않는다
          # Step 4에서 관리자 비밀번호를 폐기했으므로 여기서 다시 조회 (최소 보관)
          DB_SECRET_JSON=$(read_db_admin_json) || abort "관리자 환경 파일 재조회 실패"
          RESTORE_DB_HOST=$(printf '%s' "$DB_SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["host"])')
          RESTORE_DB_USER=$(printf '%s' "$DB_SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["username"])')
          RESTORE_DB_PASS=$(printf '%s' "$DB_SECRET_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["password"])')
          unset DB_SECRET_JSON
          RESTORE_TEST_DB="academycraft_restore_test_$$"
          MYCNF_RESTORE=$(mktemp)
          chmod 600 "$MYCNF_RESTORE"
          cat > "$MYCNF_RESTORE" <<EOF
          [client]
          host=$RESTORE_DB_HOST
          user=$RESTORE_DB_USER
          password=$RESTORE_DB_PASS
          connect-timeout=10
          EOF
          unset RESTORE_DB_PASS
          # 실패·timeout·중단 시에도 임시 DB와 자격증명 파일이 정리되도록 trap
          # EXIT는 사용하지 않음 (바깥의 cleanup_academycraft_on_fail trap과 충돌 방지)
          # INT/TERM 시에만 정리, EXIT(정상/실패 종료)는 명시적 호출로 처리
          cleanup_restore() {
            local drop_failed=0
            if [ -n "${MYCNF_RESTORE:-}" ] && [ -f "$MYCNF_RESTORE" ]; then
              mysql --defaults-extra-file="$MYCNF_RESTORE" \
                -e "DROP DATABASE IF EXISTS $RESTORE_TEST_DB;" 2>/dev/null || drop_failed=1
              # 삭제 실패 시 명시적으로 보고 (성공으로 처리하지 않음)
              if [ $drop_failed -eq 1 ]; then
                log "WARNING: 테스트 DB 삭제 실패 — 수동 확인 필요: $RESTORE_TEST_DB"
              else
                # 삭제 후 실제로 DB가 없어졌는지 확인
                # 조회 실패 시에도 정리 실패로 처리 (echo "1" → db_still_exists != "0")
                local db_still_exists
                db_still_exists=$(mysql --defaults-extra-file="$MYCNF_RESTORE" -N \
                  -e "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='$RESTORE_TEST_DB';" 2>/dev/null || echo "1")
                if [ "$db_still_exists" != "0" ]; then
                  log "WARNING: 테스트 DB가 남아있음 — 후속 확인 필요: $RESTORE_TEST_DB"
                  drop_failed=1
                fi
              fi
              shred -u "$MYCNF_RESTORE"
            fi
            unset MYCNF_RESTORE RESTORE_DB_HOST RESTORE_DB_USER RESTORE_TEST_DB
            return $drop_failed
          }
          trap cleanup_restore INT TERM
          # 복원 테스트 실패 시 정리 후 중단하는 헬퍼
          # (abort는 exit 1을 호출하므로, EXIT trap이 서비스 정리를 담당)
          abort_restore() {
            log "복원 테스트 실패 — 정리 후 중단: $*"
            trap - INT TERM
            cleanup_restore || log "WARNING: 복원 테스트 정리 중 오류 — 수동 확인 필요"
            abort "$*"
          }
          # 복원 테스트용 임시 DB 생성 (격리)
          mysql --defaults-extra-file="$MYCNF_RESTORE" \
            -e "CREATE DATABASE $RESTORE_TEST_DB CHARACTER SET utf8mb4;" \
            || abort_restore "복원 테스트 DB 생성 실패"
          # 백업을 임시 DB에 복원
          if ! zcat "$LATEST_BACKUP" | mysql --defaults-extra-file="$MYCNF_RESTORE" "$RESTORE_TEST_DB"; then
            abort_restore "백업 복원 테스트 실패"
          fi
          # 테이블 수 확인 (원본과 일치하는지)
          ORIG_TABLES=$(mysql --defaults-extra-file="$MYCNF_RESTORE" academycraft -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='academycraft';")
          RESTORED_TABLES=$(mysql --defaults-extra-file="$MYCNF_RESTORE" "$RESTORE_TEST_DB" -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='$RESTORE_TEST_DB';")
          if [ "$ORIG_TABLES" != "$RESTORED_TABLES" ]; then
            abort_restore "복원 검증 실패: 원본 테이블 수($ORIG_TABLES) != 복원 테이블 수($RESTORED_TABLES)"
          fi
          log "복원 검증 통과: $RESTORED_TABLES개 테이블"
          # 정상 완료 시 정리 (INT/TERM trap 해제 후 명시적 정리)
          # EXIT trap(cleanup_academycraft_on_fail)은 유지 — 전체 스크립트 완료까지
          trap - INT TERM
          # 정리 실패 시 배포 실패 처리 (WARNING만 출력하고 넘어가지 않음)
          # 자격증명 파일은 정리하고, 테스트 DB 잔존 사실을 보고한 뒤 실패
          if ! cleanup_restore; then
            # cleanup_restore가 이미 자격증명 파일을 정리했음
            # 테스트 DB가 남아있을 수 있으므로 배포를 실패 처리
            abort "복원 테스트 정리 실패 — 테스트 DB가 남아있을 수 있음. 수동 확인 필요"
          fi
          log "격리 복원 검증 완료 (테스트 DB·자격증명 삭제됨)"

          # 전체 배포 스크립트 성공 — EXIT trap 해제 (서비스 정지 방지)
          # cleanup_academycraft_on_fail은 exit 0 시 서비스를 유지하므로,
          # 여기서 해제하지 않아도 되지만 명시적으로 해제하여 의도를 분명히 함
          trap - EXIT
          log "DEPLOY SCRIPT OK"
          SCRIPT_EOF
          chmod 700 /tmp/academycraft-deploy.sh
          bash -n /tmp/academycraft-deploy.sh
          aws s3 cp /tmp/academycraft-deploy.sh "$DEPLOY_S3_PREFIX/deploy.sh"
          echo "배포 스크립트 업로드: $DEPLOY_S3_PREFIX/deploy.sh"

      - name: SSM으로 배포 실행
        shell: bash
        env:
          BACKUP_BUCKET: ${{ inputs.backup_bucket }}
        run: |
          set -euo pipefail
          # backup_bucket 필수 확인 (workflow input required=true 이지만 이중 검증)
          if [ -z "${BACKUP_BUCKET:-}" ]; then
            echo "::error::backup_bucket이 비어 있습니다. 백업은 필수입니다."
            exit 1
          fi
          # 민감값을 포함하지 않는 SSM 명령 구성
          # DB 관리자 비밀번호는 GitHub에 없음 — EC2가 호스트 내부 환경 파일에서 조회
          Q() { printf '%q' "$1"; }
          # 신규 계정에서 조회한 RDS endpoint의 해시만 원격에 전달한다 (호스트명·비밀값 미출력).
          ALLOWED_DB_HOST_HASHES=$(aws rds describe-db-instances --query 'DBInstances[?starts_with(DBInstanceIdentifier, `f2r-`)].Endpoint.Address' --output json | python3 -c 'import json,sys,hashlib; print(",".join(hashlib.sha256(h.encode()).hexdigest() for h in json.load(sys.stdin)))')
          [ -n "$ALLOWED_DB_HOST_HASHES" ] || { echo "신규 RDS 없음"; exit 1; }
          CMD="export APP_PORT=$(Q "$APP_PORT") DEPLOY_S3_PREFIX=$(Q "$DEPLOY_S3_PREFIX")"
          CMD="$CMD DB_ADMIN_ENV_FILE=$(Q "$DB_ADMIN_ENV_FILE")"
          CMD="$CMD BACKUP_BUCKET=$(Q "$BACKUP_BUCKET") ALLOWED_DB_HOST_HASHES=$(Q "$ALLOWED_DB_HOST_HASHES"); "
          CMD="$CMD aws s3 cp $(Q "$DEPLOY_S3_PREFIX/deploy.sh") /tmp/academycraft-deploy.sh"
          CMD="$CMD && chmod 700 /tmp/academycraft-deploy.sh && bash /tmp/academycraft-deploy.sh"
          python3 - "$CMD" <<'PYEOF' > /tmp/ssm-params.json
          import json, sys
          print(json.dumps({"commands": [sys.argv[1]]}))
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM Command ID: $CMD_ID"
          shred -u /tmp/ssm-params.json
          STATUS=""
          for _ in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 15
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" --output json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("StandardOutputContent","")); print("STDERR:", d.get("StandardErrorContent",""))'
          if [ "$STATUS" != "Success" ]; then
            echo "::error::배포 실패 (Status=$STATUS)"
            exit 1
          fi
          echo "배포 스크립트 성공"

  # ------------------------------------------------------------------
  # 4. 검증: health-check + Flyway (SSM 읽기 전용)
  #    DB 비밀번호는 EC2의 /etc/academycraft/env 에서 읽음 (GitHub 무관)
  # ------------------------------------------------------------------
  verify:
    if: inputs.operation == 'initial'
    name: 배포 검증
    needs: [guard, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: AWS 인증 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 신규 AWS 계정 강제 확인
        shell: bash
        run: |
          set -euo pipefail
          [ "$(aws sts get-caller-identity --query Account --output text)" = "425805163960" ]

      - name: Health-check·Flyway 검증 (SSM 읽기 전용)
        shell: bash
        run: |
          set -euo pipefail
          # EC2 내부에서 /etc/academycraft/env를 읽어 DB 접속 (GitHub에 비밀번호 없음)
          Q() { printf '%q' "$1"; }
          CMD='set -a; . /etc/academycraft/env; set +a; '
          CMD="$CMD"'for i in $(seq 1 12); do curl -fsS --max-time 5 http://127.0.0.1:'"$(Q "$APP_PORT")"'/actuator/health && break || sleep 5; done; '
          CMD="$CMD"'echo "--- flyway ---"; '
          # MYSQL_PWD 환경변수로 비밀번호 전달 (명령행 노출 방지)
          CMD="$CMD"'DB_HOST_FROM_URL=$(printf "%s" "$DB_URL" | sed -n "s|.*mysql://\\([^:]*\\):.*|\\1|p"); '
          CMD="$CMD"'MYSQL_PWD="$DB_PASSWORD" mysql -h "$DB_HOST_FROM_URL" -u "$DB_USERNAME" academycraft -e "SELECT version, success FROM flyway_schema_history ORDER BY installed_rank;"'
          python3 - "$CMD" <<'PYEOF' > /tmp/ssm-params.json
          import json, sys
          print(json.dumps({"commands": [sys.argv[1]]}))
          PYEOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          shred -u /tmp/ssm-params.json
          STATUS=""
          for _ in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query 'Status' --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break;; esac
            sleep 10
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query 'StandardOutputContent' --output text)
          echo "$OUT"
          echo "$OUT" | grep -q '"status":"UP"' \
            || { echo "::error::health-check 실패 — UP 응답 없음"; exit 1; }
          echo "$OUT" | grep -q "3" \
            || echo "::warning::flyway_schema_history 에서 V3 확인 필요 — 위 출력 참조"
          echo "검증 통과"

      - name: 후속 수동 단계 안내
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## AcademyCraft 배포 완료 — 후속 수동 단계

          로컬 health-check 와 Flyway 검증을 통과했습니다. 아래는 워크플로우가
          수행하지 않는 수동 단계입니다.

          ### 1. ALB 라우팅 (AWS 콘솔, 미승인 시 실행 금지)
          1. 대상 그룹 `academy-tg` 생성 — HTTP, 포트 8082, 헬스체크 `/actuator/health`
          2. HTTPS 리스너에 규칙 추가 — 호스트 `academy.feel2real.co.kr` → `academy-tg`
          3. 기존 규칙과 우선순위 충돌 확인
          4. `curl https://academy.feel2real.co.kr/actuator/health` → `{"status":"UP"}`

          ### 2. 브라우저 QA (운영 도메인, PC·모바일 10개 항목)
          QA PASS 전 정식 오픈 금지.

          ### 3. 백업 검증
          배포 시 백업 cron이 설치되고 초기 백업이 검증되었습니다.
          월 1회 복원 테스트 일정을 등록하세요.

          ### 4. 배포 중 감시 결과
          배포 스크립트는 시작 전 f2r-app·buildit-wiki 정상을 확인했습니다.
          이상 발생 시 `sudo systemctl stop academycraft` 후 보고하세요.
          EOF


  existing:
    name: 기존 배포 점검·업데이트 (삭제·초기화 없음)
    if: inputs.operation == 'inspect' || inputs.operation == 'update'
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: operations
      - name: 운영 스크립트 자체 검증
        run: python3 -m unittest discover -s operations/ops -p 'test_*.py'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 신규 AWS·RDS 백업 확인
        id: account
        shell: bash
        run: |
          set -euo pipefail
          [ "$(aws sts get-caller-identity --query Account --output text)" = 425805163960 ]
          aws rds describe-db-instances --output json > /tmp/new-rds.json
          python3 - <<'PYCODE'
          import json,hashlib,datetime,os
          rows=json.load(open('/tmp/new-rds.json'))['DBInstances']
          now=datetime.datetime.now(datetime.timezone.utc)
          good=[]
          for row in rows:
            restore=datetime.datetime.fromisoformat(row['LatestRestorableTime'].replace('Z','+00:00'))
            if row['BackupRetentionPeriod']<1 or (now-restore).total_seconds()>1800: continue
            good.append(hashlib.sha256(row['Endpoint']['Address'].encode()).hexdigest())
            print('backup:',row['DBInstanceIdentifier'],row['BackupRetentionPeriod'],restore.isoformat())
          if not good: raise SystemExit('No recent new-account RDS backup')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('hashes='+','.join(good)+'\n')
          PYCODE
      - name: 검증된 AcademyCraft 코드 체크아웃
        if: inputs.operation == 'update' && inputs.existing_command_id == ''
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
          path: source
      - uses: actions/setup-java@v4
        if: inputs.operation == 'update' && inputs.existing_command_id == ''
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: source/pom.xml
      - name: 기존 CI 결과 확인 (재실행 없음)
        if: inputs.operation == 'update' && inputs.existing_command_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.guard.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/woori73/academycraft/actions/runs?head_sha=$DEPLOY_SHA&event=push" --jq '.workflow_runs' > /tmp/ci.json
          python3 - <<'PYCODE'
          import json
          rows=[r for r in json.load(open('/tmp/ci.json')) if r['name']=='CI']
          if not rows or rows[0]['status']!='completed' or rows[0]['conclusion']!='success': raise SystemExit('Pinned main CI is not successful')
          PYCODE
      - name: 기존 검증 코드 패키징 (테스트 재실행 없음)
        if: inputs.operation == 'update' && inputs.existing_command_id == ''
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/src/main/resources/static
          cp -r frontend/* backend/src/main/resources/static/
          mvn -B package -DskipTests
      - name: SHA 고정 JAR 업로드
        if: inputs.operation == 'update' && inputs.existing_command_id == ''
        id: artifact
        env:
          DEPLOY_SHA: ${{ needs.guard.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          JAR=source/target/academycraft-1.0.0.jar
          test -f "$JAR"
          DIGEST=$(sha256sum "$JAR" | cut -d' ' -f1)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          aws s3 cp "$JAR" "$DEPLOY_S3_PREFIX/$DEPLOY_SHA/academycraft.jar" --only-show-errors
      - name: 기존 서버에서 점검 또는 백업 후 업데이트
        env:
          OPERATION: ${{ inputs.operation }}
          BINDINGS: ${{ inputs.bindings_json }}
          HASHES: ${{ steps.account.outputs.hashes }}
          DEPLOY_SHA: ${{ needs.guard.outputs.sha }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          EXISTING_COMMAND: ${{ inputs.existing_command_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE' > /tmp/ssm-operation.json
          import base64,json,os,pathlib,shlex
          code=base64.b64encode(pathlib.Path('operations/ops/existing-deployment.py').read_bytes()).decode()
          binding=base64.b64encode(os.environ['BINDINGS'].encode()).decode()
          args=[os.environ['OPERATION'],os.environ['HASHES'],binding,os.environ['DEPLOY_SHA'],os.environ.get('DIGEST','')]
          command='echo '+code+' | base64 -d | python3 - '+' '.join(map(shlex.quote,args))
          print(json.dumps({'commands':['set -eu',command]}))
          PYCODE
          if [ -n "$EXISTING_COMMAND" ]; then
            [[ "$EXISTING_COMMAND" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || exit 1
            CID="$EXISTING_COMMAND"
          else
            CID=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript --parameters file:///tmp/ssm-operation.json --query Command.CommandId --output text)
          fi
          echo "SSM command: $CID"
          for _ in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut|Cancelling) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
          [ "$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text)" = Success ]
