name: MySQL 8.4 production smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-academycraft.yml'
      - '.github/workflows/mysql-production-smoke.yml'
      - 'backend/src/main/resources/application-prod.properties'
      - 'backend/src/main/resources/db/migration/**'
      - 'pom.xml'
      - 'backend/src/main/java/**'
permissions:
  contents: read
jobs:
  mysql-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: academycraft_ci
          MYSQL_USER: academycraft_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package existing app (previous unit tests are not repeated here)
        run: mvn -B package -DskipTests
      - name: Production profile boot, Flyway V1-V6 and auth fallback check
        shell: bash
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/academycraft_ci?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
          DB_USERNAME: academycraft_ci
          DB_PASSWORD: ci-only-password
          REA_JWT_SECRET: ci-only-jwt-secret-with-at-least-thirty-two-bytes
          MYSQL_PWD: ci-only-password
        run: |
          set -euo pipefail
          java -Xmx768m -jar target/academycraft-*.jar --spring.profiles.active=prod --server.port=8082 > /tmp/academycraft-prod-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do
            if curl -fsS --max-time 3 http://127.0.0.1:8082/actuator/health > /tmp/health.json; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then tail -100 /tmp/academycraft-prod-smoke.log; exit 1; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:8082/actuator/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="UP"'
          HISTORY=$(mysql -h127.0.0.1 -uacademycraft_ci academycraft_ci -N -e "SELECT GROUP_CONCAT(CONCAT(version, ':', success) ORDER BY installed_rank) FROM flyway_schema_history")
          [ "$HISTORY" = "1:1,2:1,3:1,4:1,5:1,6:1" ] || { echo "Unexpected Flyway history: $HISTORY"; exit 1; }
          PLANS=$(mysql -h127.0.0.1 -uacademycraft_ci academycraft_ci -N -e "SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema='academycraft_ci' AND table_name='rea_agent_plans' AND index_name='uq_agent_plan_idem' AND non_unique=0")
          [ "$PLANS" = "2" ] || { echo "rea_agent_plans unique idempotency key missing: $PLANS"; exit 1; }
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Auth-Key: ci-invalid-key' http://127.0.0.1:8082/api/rea/1/students)
          [ "$STATUS" = 401 ] || { echo "Production auth fallback is not closed: $STATUS"; exit 1; }
          echo "PASS: prod boot + ddl validation + V1-V6 + X-Auth-Key 401"
      - name: Approved bootstrap transaction and idempotency on disposable MySQL
        run: python3 ops/bootstrap-mysql-smoke.py
