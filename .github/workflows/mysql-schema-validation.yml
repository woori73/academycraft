name: MySQL Schema Validation (임시)

# P0-4 V1 DRAFT 검증용 일회성 워크플로우. 검증 완료 후 삭제할 것.
# - 격리 MySQL 8.x (서비스 컨테이너)에 V1→V2→V3 적용
# - ddl-auto=validate 로 엔티티-스키마 정합성 확인
# - 인증 API 통합 테스트 (로그인→대시보드→로그아웃)
# - 운영 DB 사용 금지

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academycraft
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: MySQL 스키마 검증 테스트
        run: mvn -B test -Dtest=MySqlSchemaValidationTest -Drea.mysql.validation=true -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
