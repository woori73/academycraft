<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademyCraft - 성적 조회 - GRD-02</title>
<style>
  /* 최소 기능 UI. 디자인 차별화는 2차. 업무 로직과 분리. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
  .header { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; }
  .card { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
  .field select, .field input { width: 100%; padding: 10px; border: 1px solid #ddd;
                               border-radius: 8px; font-size: 14px; }
  .grade-row { display: flex; justify-content: space-between; align-items: center;
               padding: 12px 0; border-bottom: 1px solid #eee; }
  .grade-row:last-child { border-bottom: none; }
  .grade-main { font-size: 15px; font-weight: bold; }
  .grade-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .grade-score { font-size: 18px; font-weight: bold; color: #0066cc; }
  .summary { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .summary .stat { background: #fff; border-radius: 8px; padding: 12px 16px; flex: 1; min-width: 120px; }
  .stat .v { font-size: 20px; font-weight: bold; }
  .stat .k { font-size: 12px; color: #888; margin-top: 2px; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .btn-ghost { background: #fff; color: #0066cc; border: 1px solid #0066cc;
               border-radius: 8px; cursor: pointer; text-decoration: none; }
  .btn { background: #0066cc; color: #fff; border: none; border-radius: 8px;
         cursor: pointer; text-decoration: none; }
  .nav { margin-bottom: 16px; display: flex; gap: 8px; }
  .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .msg.err { display: block; background: #fce8e6; color: #c5221f; }
  .empty { color: #888; font-size: 14px; text-align: center; padding: 24px; }
  @media (max-width: 600px) {
    .grade-row { flex-direction: column; align-items: flex-start; gap: 4px; }
  }

  /* [Phase5-Task4] 모바일 터치 영역 보강 (480px 이하) */
  @media (max-width: 480px) {
    button, .btn { min-height: 44px; }
    input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
    select, textarea { min-height: 44px; font-size: 16px; }
    input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; min-width: 0; flex: none; accent-color: #0066cc; }
  }
</style>
<script defer src="../components/home-navigation.js"></script>
</head>
<body>
<nav aria-label="Feel2Real 홈" style="position:relative;z-index:1;margin:8px 0;"><a data-feel2real-home href="https://feel2real.co.kr/" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:#0066cc;white-space:nowrap;">홈으로</a></nav>
<div class="header">
  <h1>성적 조회</h1>
  <p style="color:#666;font-size:13px;margin-top:4px;">REA 6단계 구현 - GRD-02 · 강사·학부모 · 학생별 성적 이력</p>
</div>

<div class="nav">
  <a href="GRD-01-grade-form.html" class="btn btn-ghost btn-sm">성적 등록</a>
  <a href="GRD-02-grade-list.html" class="btn btn-sm">성적 조회</a>
  <a href="RPT-01-learning-report.html" class="btn btn-ghost btn-sm">학습 리포트</a>
</div>

<div class="msg" id="msg"></div>

<div class="card">
  <div class="field">
    <label>학생</label>
    <select id="f-student" onchange="loadGrades()"><option value="">학생 선택</option></select>
  </div>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="stat"><div class="v" id="s-count">0</div><div class="k">성적 건수</div></div>
  <div class="stat"><div class="v" id="s-avg">-</div><div class="k">평균 백분율</div></div>
</div>

<div class="card" id="list"><div class="empty">학생을 선택하세요.</div></div>

<script src="../components/auth.js"></script>
<script src="../components/api-client.js"></script>
<script>
var REA_API_BASE = '/api/rea'; // 학원 경로는 로그인 JWT에서 결정

function showMsg(text) {
  const m = document.getElementById('msg');
  m.className = 'msg err';
  m.textContent = text;
}

async function loadStudents() {
  try {
    const res = await apiGet(`/@academy/students`);
    const data = await res.json();
    if (!res.ok) return;
    const sel = document.getElementById('f-student');
    data.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = `${s.name}${s.grade ? ' (' + s.grade + ')' : ''}`;
      sel.appendChild(opt);
    });
  } catch (e) { /* 무시 */ }
}

async function loadGrades() {
  const studentId = document.getElementById('f-student').value;
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  if (!studentId) {
    list.innerHTML = '<div class="empty">학생을 선택하세요.</div>';
    summary.style.display = 'none';
    return;
  }
  try {
    const res = await apiGet(`/@academy/grades/student/${studentId}`);
    const data = await res.json();
    if (!res.ok) { showMsg(data.message || '조회 실패'); return; }
    if (data.length === 0) {
      list.innerHTML = '<div class="empty">등록된 성적이 없습니다.</div>';
      summary.style.display = 'none';
      return;
    }
    const avg = data.reduce((a, g) => a + g.rate, 0) / data.length;
    document.getElementById('s-count').textContent = data.length;
    document.getElementById('s-avg').textContent = (Math.round(avg * 10) / 10) + '점';
    summary.style.display = 'flex';
    list.innerHTML = '';
    data.forEach(g => {
      const row = document.createElement('div');
      row.className = 'grade-row';
      const note = g.note ? `<div class="grade-sub">${escapeHtml(g.note)}</div>` : '';
      row.innerHTML =
        `<div><div class="grade-main">${escapeHtml(g.examName)} · ${escapeHtml(g.subject)}</div>` +
        `<div class="grade-sub">${g.examDate}</div>${note}</div>` +
        `<div class="grade-score">${g.score}/${g.fullScore} (${g.rate}점)</div>`;
      list.appendChild(row);
    });
  } catch (e) {
    showMsg('서버 연결 실패');
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadStudents();
</script>
</body>
</html>
