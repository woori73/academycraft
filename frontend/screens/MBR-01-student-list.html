<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademyCraft - 학생 목록 (1차 구현)</title>
<style>
  /* 최소 기능 UI. 디자인 차별화는 2차. 업무 로직과 분리. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
  .header { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; }
  .search { display: flex; gap: 8px; margin-bottom: 16px; }
  .search input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  .search button { padding: 10px 16px; background: #0066cc; color: #fff; border: none; border-radius: 8px; }
  .student-card { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .student-info { font-size: 14px; }
  .student-name { font-weight: bold; font-size: 16px; }
  .btn { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
  .btn-primary { background: #0066cc; color: #fff; border-color: #0066cc; }
  #add-form { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; display: none; }
  #add-form input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; }

  /* [Phase5-Task4] 모바일 터치 영역 보강 (480px 이하) */
  @media (max-width: 480px) {
    button, .btn { min-height: 44px; }
    input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
    select, textarea { min-height: 44px; font-size: 16px; }
    input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; min-width: 0; flex: none; accent-color: #0066cc; }

    .search { flex-wrap: wrap; }
    .search input { flex: 1 1 100%; }
    .search button { flex: 1; white-space: nowrap; }  }
</style>
<script defer src="../components/home-navigation.js"></script>
</head>
<body>
<nav aria-label="Feel2Real 홈" style="position:relative;z-index:1;margin:8px 0;"><a data-feel2real-home href="https://feel2real.co.kr/" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:#0066cc;white-space:nowrap;">홈으로</a></nav>
<div class="header">
  <h1>학생 관리</h1>
  <p style="color:#666;font-size:13px;margin-top:4px;">REA 1차 구현 - MBR-01</p>
</div>

<div class="search">
  <input type="text" id="search" placeholder="학생 이름 검색">
  <button onclick="loadStudents()">검색</button>
  <button class="btn-primary btn" onclick="toggleForm()">+ 학생 등록</button>
</div>

<div id="add-form">
  <input type="text" id="f-name" placeholder="학생 이름 (필수)">
  <input type="text" id="f-grade" placeholder="학년 (예: 고2)">
  <input type="text" id="f-parent" placeholder="학부모 이름">
  <input type="text" id="f-phone" placeholder="학부모 연락처">
  <button class="btn-primary btn" onclick="createStudent()">등록</button>
  <button class="btn" onclick="toggleForm()">취소</button>
</div>

<div id="list"></div>

<script src="../components/auth.js"></script>
<script src="../components/api-client.js"></script>
<script>
var REA_API_BASE = '/api/rea'; // 학원 경로는 로그인 JWT에서 결정
// 학원 경로는 JWT의 academyId로 공통 클라이언트에서 결정한다.

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toggleForm() {
  const f = document.getElementById('add-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function loadStudents() {
  const kw = document.getElementById('search').value;
  const url = `/@academy/students${kw ? '?name=' + encodeURIComponent(kw) : ''}`;
  const res = await apiGet(url);
  const students = await res.json();
  const list = document.getElementById('list');
  list.innerHTML = students.map(s => `
    <div class="student-card">
      <div class="student-info">
        <div class="student-name">${escapeHtml(s.name)}</div>
        <div>${escapeHtml(s.grade || '')} ${s.parentName ? '· ' + escapeHtml(s.parentName) : ''}</div>
      </div>
      <button class="btn" onclick="showDetail(${s.id})">상세·수정</button>
    </div>
  `).join('') || '<p style="color:#999;">등록된 학생이 없습니다.</p>';
}

async function createStudent() {
  const body = {
    name: document.getElementById('f-name').value,
    grade: document.getElementById('f-grade').value,
    parentName: document.getElementById('f-parent').value,
    parentPhone: document.getElementById('f-phone').value
  };
  if (!body.name) { alert('학생 이름을 입력하세요.'); return; }
  const res = await apiPost(`/@academy/students`, body);
  const saved = await res.json();
  alert(`등록 완료. 인증키: ${saved.authKey}\n학부모에게 공유하세요.`);
  toggleForm();
  loadStudents();
}

async function showDetail(id) {
  const res = await apiGet(`/@academy/students/${id}`);
  const s = await res.json();
  const name = prompt("이름", s.name);
  if (name === null) return;
  const grade = prompt("학년", s.grade || "");
  if (grade === null) return;
  const schoolName = prompt("학교", s.schoolName || "");
  if (schoolName === null) return;
  const parentName = prompt("학부모 이름", s.parentName || "");
  if (parentName === null) return;
  const parentPhone = prompt("학부모 연락처", s.parentPhone || "");
  if (parentPhone === null) return;

  const putRes = await apiPut(`/@academy/students/${id}`, { name, grade, schoolName, parentName, parentPhone });
  if (putRes.ok) {
    alert("수정 완료");
    loadStudents();
  } else {
    alert("수정 실패: " + putRes.status);
  }
}

loadStudents();
</script>
</body>
</html>
