<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademyCraft - 비밀번호 찾기 - AUTH-02</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5;
         display: flex; justify-content: center; align-items: center;
         min-height: 100vh; padding: 16px; }
  .card { background: #fff; padding: 32px 24px; border-radius: 12px;
          width: 100%; max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .logo { text-align: center; margin-bottom: 24px; }
  .logo h1 { font-size: 20px; color: #0066cc; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px; border: 1px solid #ddd;
                 border-radius: 8px; font-size: 16px; }
  .btn { width: 100%; padding: 14px; background: #0066cc; color: #fff;
         border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px;
         display: none; font-size: 14px; }
  .msg.err { display: block; background: #fce8e6; color: #c5221f; }
  .msg.ok { display: block; background: #e6f4ea; color: #1a7f37; }
  .links { text-align: center; margin-top: 16px; font-size: 13px; }
  .links a { color: #0066cc; text-decoration: none; }
  .step { display: none; }
  .step.active { display: block; }
  @media (max-width: 480px) {
    button, .btn { min-height: 44px; }
    input { min-height: 44px; font-size: 16px; }
  }
</style>
<script defer src="../components/home-navigation.js"></script>
</head>
<body>
<nav aria-label="Feel2Real 홈" style="position:fixed;top:0;left:16px;z-index:1;margin:8px 0;"><a data-feel2real-home href="https://feel2real.co.kr/" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:#0066cc;white-space:nowrap;">홈으로</a></nav>
<div class="card">
  <div class="logo"><h1>비밀번호 찾기</h1></div>
  <div class="msg" id="msg"></div>

  <div class="step active" id="step1">
    <div class="field">
      <label for="loginId">아이디</label>
      <input type="text" id="loginId" autocomplete="username" placeholder="가입한 아이디">
    </div>
    <button class="btn" onclick="requestReset()">재설정 안내 받기</button>
  </div>

  <div class="step" id="step2">
    <div class="field">
      <label for="newPassword">새 비밀번호 (8자 이상, 영문+숫자)</label>
      <input type="password" id="newPassword" autocomplete="new-password">
    </div>
    <button class="btn" onclick="confirmReset()">비밀번호 변경</button>
  </div>

  <div class="links"><a href="AUTH-01-login.html">로그인으로 돌아가기</a></div>
</div>
<script>
  let devToken = null; // 개발 환경에서만 서버가 토큰 반환
  const msg = document.getElementById('msg');

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = ok ? 'msg ok' : 'msg err';
  }

  async function requestReset() {
    const btn = document.querySelector('#step1 .btn');
    msg.className = 'msg';
    btn.disabled = true;
    try {
      const res = await fetch('/api/rea/auth/password-reset/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ loginId: document.getElementById('loginId').value.trim() }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showMsg(data.message || '서버 오류가 발생했습니다. 잠시 후 다시 시도하세요.', false);
        return;
      }
      showMsg(data.message, true);
      if (data.resetToken) {
        // 개발 환경: 바로 2단계로 (운영에서는 SMS·이메일의 링크로 진입)
        devToken = data.resetToken;
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
      }
    } catch (e) {
      showMsg('요청에 실패했습니다. 네트워크 연결을 확인하고 다시 시도하세요.', false);
    } finally {
      btn.disabled = false;
    }
  }

  async function confirmReset() {
    const btn = document.querySelector('#step2 .btn');
    msg.className = 'msg';
    btn.disabled = true;
    try {
      const res = await fetch('/api/rea/auth/password-reset/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: devToken,
          newPassword: document.getElementById('newPassword').value,
        }),
      });
      if (res.ok || res.status === 204) {
        showMsg('비밀번호가 변경되었습니다. 로그인하세요.', true);
        setTimeout(() => location.href = 'AUTH-01-login.html', 1500);
      } else {
        const data = await res.json().catch(() => ({}));
        showMsg(data.message || '재설정에 실패했습니다.', false);
      }
    } catch (e) {
      showMsg('요청에 실패했습니다. 네트워크 연결을 확인하고 다시 시도하세요.', false);
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
