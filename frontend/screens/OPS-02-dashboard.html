<style>
  /* 최소 기능 UI. 디자인 차별화는 2차. 업무 로직과 분리. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
  .header { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; }
  .nav { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 12px 20px; background: #0066cc; color: #fff; border: none;
         border-radius: 8px; cursor: pointer; font-size: 15px; }
  .btn-sm { padding: 6px 12px; font-size: 13px; text-decoration: none; display: inline-block; }
  .btn-ghost { background: #fff; color: #0066cc; border: 1px solid #0066cc; }
  .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .msg.ok { display: block; background: #e6f4ea; color: #1a7f37; }
  .msg.err { display: block; background: #fce8e6; color: #c5221f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; padding: 16px; border-radius: 8px; }
  .card .label { font-size: 13px; color: #666; margin-bottom: 8px; }
  .card .value { font-size: 28px; font-weight: bold; }
  .card .unit { font-size: 13px; color: #888; font-weight: normal; }
  .card .sub { font-size: 12px; color: #888; margin-top: 6px; }
  .panel { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin-bottom: 12px; }
  .att-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .att-box { flex: 1; min-width: 90px; text-align: center; padding: 12px 8px;
             background: #f8f9fa; border-radius: 8px; }
  .att-box .n { font-size: 22px; font-weight: bold; }
  .att-box .t { font-size: 12px; color: #666; margin-top: 4px; }
  .meta { font-size: 12px; color: #888; text-align: right; margin-top: 8px; }
  .hint { font-size: 12px; color: #888; }

  /* [Phase5-Task4] 모바일 터치 영역 보강 (480px 이하) */
  @media (max-width: 480px) {
    button, .btn { min-height: 44px; }
    input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
    select, textarea { min-height: 44px; font-size: 16px; }
    input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; min-width: 0; flex: none; accent-color: #0066cc; }
  }
</style>

<script>
var REA_API_BASE = '/api/rea'; // 학원 경로는 로그인 JWT에서 결정

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function loadStats() {
  try {
    const res = await apiGet(`/@academy/dashboard/stats`);
    if (!res.ok) throw new Error('조회 실패');
    const s = await res.json();

    document.getElementById('v-students').innerHTML =
      `${s.studentCount} <span class="unit">명</span>`;
    document.getElementById('v-classes').innerHTML =
      `${s.classCount} <span class="unit">개</span>`;
    document.getElementById('v-unanswered').innerHTML =
      `${s.unansweredConsultationCount} <span class="unit">건</span>`;
    document.getElementById('v-notices').textContent = s.monthlyNoticeCount;

    const t = s.todayAttendance || {};
    document.getElementById('att-date').textContent = `(${t.date || ''})`;
    document.getElementById('a-in').textContent = t.checkInCount != null ? t.checkInCount : '-';
    document.getElementById('a-out').textContent = t.checkOutCount != null ? t.checkOutCount : '-';
    document.getElementById('a-absent').textContent = t.absentCount != null ? t.absentCount : '-';
    document.getElementById('a-late').textContent = t.lateCount != null ? t.lateCount : '-';
    document.getElementById('a-early').textContent = t.earlyLeaveCount != null ? t.earlyLeaveCount : '-';
    document.getElementById('a-students').textContent = t.studentCount != null ? t.studentCount : '-';

    if (s.generatedAt) {
      document.getElementById('gen-at').textContent =
        `집계 시각: ${s.generatedAt.replace('T', ' ').substring(0, 16)}`;
    }
    showMsg('', true);
  } catch (e) {
    showMsg('대시보드 조회 실패: ' + e.message, false);
  }
}

loadStats();
</script>
