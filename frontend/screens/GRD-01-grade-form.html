<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademyCraft - 성적 등록 - GRD-01</title>
<style>
  /* 최소 기능 UI. 디자인 차별화는 2차. 업무 로직과 분리. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
  .header { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; }
  .form { background: #fff; padding: 16px; border-radius: 8px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
  .field input, .field select { width: 100%; padding: 10px; border: 1px solid #ddd;
                               border-radius: 8px; font-size: 14px; }
  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; }
  .btn { padding: 12px 20px; background: #0066cc; color: #fff; border: none;
         border-radius: 8px; cursor: pointer; font-size: 15px; width: 100%; }
  .btn-sm { padding: 6px 12px; font-size: 13px; width: auto; }
  .btn-ghost { background: #fff; color: #0066cc; border: 1px solid #0066cc; }
  .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .msg.ok { display: block; background: #e6f4ea; color: #1a7f37; }
  .msg.err { display: block; background: #fce8e6; color: #c5221f; }
  .nav { margin-bottom: 16px; display: flex; gap: 8px; }
  .hint { font-size: 12px; color: #888; margin-top: 4px; }
  @media (max-width: 600px) {
    .row { flex-direction: column; gap: 0; }
  }

  /* [Phase5-Task4] 모바일 터치 영역 보강 (480px 이하) */
  @media (max-width: 480px) {
    button, .btn { min-height: 44px; }
    input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
    select, textarea { min-height: 44px; font-size: 16px; }
    input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; min-width: 0; flex: none; accent-color: #0066cc; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>성적 등록</h1>
  <p style="color:#666;font-size:13px;margin-top:4px;">REA 6단계 구현 - GRD-01 · 강사 · 등록 시 학부모에게 성적 알림 발송</p>
</div>

<div class="nav">
  <a href="GRD-01-grade-form.html" class="btn btn-sm">성적 등록</a>
  <a href="GRD-02-grade-list.html" class="btn btn-ghost btn-sm">성적 조회</a>
  <a href="RPT-01-learning-report.html" class="btn btn-ghost btn-sm">학습 리포트</a>
</div>

<div class="msg" id="msg"></div>

<div class="form">
  <div class="field">
    <label>학생</label>
    <select id="f-student"><option value="">학생 선택</option></select>
  </div>
  <div class="row">
    <div class="field">
      <label>시험명</label>
      <input id="f-exam" placeholder="예: 10월 모의고사">
    </div>
    <div class="field">
      <label>과목</label>
      <input id="f-subject" placeholder="예: 수학">
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label>점수</label>
      <input id="f-score" type="number" min="0" placeholder="예: 85">
    </div>
    <div class="field">
      <label>만점</label>
      <input id="f-full" type="number" min="1" value="100">
    </div>
  </div>
  <div class="field">
    <label>시험 일자 (선택, 미입력 시 오늘)</label>
    <input id="f-date" type="date">
  </div>
  <div class="field">
    <label>비고 (선택)</label>
    <input id="f-note" placeholder="예: 계산 실수 2문항">
  </div>
  <button class="btn" onclick="submitGrade()">성적 등록 · 알림 발송</button>
  <div class="hint">등록 즉시 해당 학부모에게 GRADE 알림이 발송됩니다. (0 ≤ 점수 ≤ 만점)</div>
</div>

<script src="../components/api-client.js"></script>
<script>
var REA_API_BASE = '/api/rea'; // academyId=1 은 각 API 경로의 '/1/' 로 지정 (개발용)

function showMsg(text, ok) {
  const m = document.getElementById('msg');
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.textContent = text;
}

async function loadStudents() {
  try {
    const res = await apiGet(`/1/students`);
    const data = await res.json();
    if (!res.ok) return;
    const sel = document.getElementById('f-student');
    data.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = `${s.name}${s.grade ? ' (' + s.grade + ')' : ''}`;
      sel.appendChild(opt);
    });
  } catch (e) { /* 무시 */ }
}

async function submitGrade() {
  const studentId = document.getElementById('f-student').value;
  const examName = document.getElementById('f-exam').value.trim();
  const subject = document.getElementById('f-subject').value.trim();
  const score = document.getElementById('f-score').value;
  const fullScore = document.getElementById('f-full').value;
  if (!studentId) { showMsg('학생을 선택하세요.', false); return; }
  if (!examName) { showMsg('시험명을 입력하세요.', false); return; }
  if (!subject) { showMsg('과목을 입력하세요.', false); return; }
  if (score === '') { showMsg('점수를 입력하세요.', false); return; }
  if (!fullScore || Number(fullScore) < 1) { showMsg('만점은 1 이상이어야 합니다.', false); return; }

  const body = {
    studentId: Number(studentId),
    examName,
    subject,
    score: Number(score),
    fullScore: Number(fullScore),
    examDate: document.getElementById('f-date').value || null,
    note: document.getElementById('f-note').value.trim() || null
  };
  try {
    const res = await apiPost(`/1/grades`, body);
    const data = await res.json();
    if (!res.ok) { showMsg(data.message || '등록 실패', false); return; }
    const n = data.notificationSentCount || 0;
    showMsg(`등록 완료 (${data.grade.rate}점) · 학부모 알림 ${n}건 발송`, true);
    document.getElementById('f-score').value = '';
    document.getElementById('f-note').value = '';
  } catch (e) {
    showMsg('서버 연결 실패', false);
  }
}

loadStudents();
</script>
</body>
</html>
