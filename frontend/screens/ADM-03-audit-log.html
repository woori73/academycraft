<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademyCraft - 변경 이력 - ADM-03</title>
<style>
  /* 최소 기능 UI. 디자인 차별화는 2차. 업무 로직과 분리. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px; }
  .header { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; }
  .nav { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 12px 20px; background: #0066cc; color: #fff; border: none;
         border-radius: 8px; cursor: pointer; font-size: 15px; }
  .btn-sm { padding: 6px 12px; font-size: 13px; text-decoration: none; display: inline-block; }
  .btn-ghost { background: #fff; color: #0066cc; border: 1px solid #0066cc; }
  .msg { padding: 10px; border-radius: 8px; margin-bottom: 12px; display: none; }
  .msg.ok { display: block; background: #e6f4ea; color: #1a7f37; }
  .msg.err { display: block; background: #fce8e6; color: #c5221f; }
  .panel { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 10px; font-size: 15px;
    border: 1px solid #ccc; border-radius: 8px; }
  .filters { display: grid; grid-template-columns: 160px 1fr auto; gap: 12px;
    align-items: end; margin-bottom: 12px; }
  .log-list { list-style: none; }
  .log-list li { padding: 12px 0; border-bottom: 1px solid #eee; }
  .log-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 4px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #e8f0fe; color: #1a73e8; }
  .badge.target { background: #f1f3f4; color: #5f6368; }
  .log-detail { font-size: 14px; margin: 4px 0; }
  .log-meta { font-size: 12px; color: #888; }
  .hint { font-size: 12px; color: #888; }
  .total { font-size: 13px; color: #666; margin-bottom: 8px; }
  @media (max-width: 600px) {
    .filters { grid-template-columns: 1fr; }
    .btn { width: 100%; }
  }
  @media (max-width: 480px) {
    button, .btn { min-height: 44px; }
    input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
    select, textarea { min-height: 44px; font-size: 16px; }
  }
</style>
<script defer src="../components/home-navigation.js"></script>
</head>
<body>
<nav aria-label="Feel2Real 홈" style="position:relative;z-index:1;margin:8px 0;"><a data-feel2real-home href="https://feel2real.co.kr/" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:#0066cc;white-space:nowrap;">홈으로</a></nav>
<div class="header">
  <h1>변경 이력</h1>
  <p style="color:#666;font-size:13px;margin-top:4px;">REA 8단계 구현 - ADM-03 · 감사 로그 (관리자용)</p>
</div>

<div class="nav">
  <a href="ADM-01-academy-info.html" class="btn btn-ghost btn-sm">학원 정보</a>
  <a href="ADM-02-user-roles.html" class="btn btn-ghost btn-sm">사용자·권한</a>
  <a href="ADM-03-audit-log.html" class="btn btn-sm">변경 이력</a>
  <a href="OPS-02-dashboard.html" class="btn btn-ghost btn-sm">대시보드</a>
</div>

<div class="msg" id="msg"></div>

<div class="panel">
  <div class="filters">
    <div class="field" style="margin-bottom:0;">
      <label>학원 ID</label>
      <input type="number" id="f-academy-id" value="1" min="1">
    </div>
    <div class="field" style="margin-bottom:0;">
      <label>이력 종류</label>
      <select id="f-action-type">
        <option value="">전체</option>
        <option value="STUDENT_CREATED">학생 등록</option>
        <option value="STUDENT_DELETED">학생 삭제</option>
        <option value="CLASS_CREATED">반 생성</option>
        <option value="CLASS_CLOSED">반 종료</option>
        <option value="ATTENDANCE_CORRECTED">출결 정정</option>
        <option value="NOTICE_CREATED">공지 작성</option>
        <option value="NOTICE_DELETED">공지 삭제</option>
        <option value="MEMBER_ROLE_CHANGED">권한 변경</option>
        <option value="ACADEMY_INFO_UPDATED">학원 정보 수정</option>
        <option value="BRANCH_CREATED">지점 등록</option>
      </select>
    </div>
    <button class="btn" onclick="loadLogs()">조회</button>
  </div>
  <p class="total" id="total"></p>
  <ul class="log-list" id="log-list"><li class="hint">불러오는 중...</li></ul>
</div>

<script src="../components/auth.js"></script>
<script src="../components/api-client.js"></script>
<script>
function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDateTime(s) {
  if (!s) return '';
  return s.replace('T', ' ').substring(0, 16);
}

async function loadLogs() {
  const id = document.getElementById('f-academy-id').value || '1';
  const type = document.getElementById('f-action-type').value;
  const q = type ? `?actionType=${type}` : '';
  const ul = document.getElementById('log-list');
  try {
    const res = await apiGet(`/${id}/audit-logs${q}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '조회 실패');
    document.getElementById('total').textContent = `총 ${data.totalCount}건 (최신순)`;
    if (!data.logs.length) {
      ul.innerHTML = '<li class="hint">기록된 변경 이력이 없습니다.</li>';
      showMsg('', true);
      return;
    }
    ul.innerHTML = data.logs.map(l => {
      const actor = l.actorName ? escapeHtml(l.actorName) : '시스템';
      const target = l.targetName
        ? `<span class="badge target">${escapeHtml(l.targetType || '')} · ${escapeHtml(l.targetName)}</span>`
        : '';
      return `<li>
        <div class="log-head">
          <span class="badge">${escapeHtml(l.actionTypeLabel)}</span>${target}
        </div>
        <div class="log-detail">${escapeHtml(l.detail || '')}</div>
        <div class="log-meta">${fmtDateTime(l.createdAt)} · 행위자: ${actor}</div>
      </li>`;
    }).join('');
    showMsg('', true);
  } catch (e) {
    ul.innerHTML = '<li class="hint">이력을 불러오지 못했습니다.</li>';
    showMsg(e.message || '서버 연결 실패', false);
  }
}

document.getElementById('f-academy-id').addEventListener('change', loadLogs);
document.getElementById('f-action-type').addEventListener('change', loadLogs);
loadLogs();
</script>
</body>
</html>
