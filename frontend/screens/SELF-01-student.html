<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AcademyCraft 내 출결</title><style>body{font-family:system-ui;margin:20px;max-width:900px}a{display:inline-block;min-height:44px}li{padding:10px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><a href="/">홈으로</a><h1>내 출결</h1><p id="status" role="status">불러오는 중…</p><ul id="events"></ul><script src="../components/auth.js"></script><script>
(async function(){try{var c=await Auth.context();if(!c.studentId)throw new Error('학생 연결이 없습니다.');var r=await Auth.api('/api/rea/'+c.academyId+'/attendance/student/'+c.studentId);if(!r.ok)throw new Error('출결 조회 권한이 없습니다.');var data=await r.json();if(!Array.isArray(data))throw new Error('출결 응답을 확인하세요.');data.forEach(function(e){var li=document.createElement('li');li.textContent=e.occurredAt+' · '+e.eventType;document.getElementById('events').appendChild(li);});document.getElementById('status').textContent=data.length?'':'출결 기록이 없습니다.';}catch(e){document.getElementById('status').textContent=e.message;}})();
</script></body></html>
