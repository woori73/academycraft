<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademyCraft - 출결 입력 (키패드) - ATT-01</title>
<style>
  /* 최소 기능 UI. 디자인 차별화는 2차. 업무 로직과 분리. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 16px;
         max-width: 480px; margin: 0 auto; }
  .header { background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 16px; text-align: center; }
  .header h1 { font-size: 20px; }
  .display { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; text-align: center; }
  #key-display { width: 100%; font-size: 28px; letter-spacing: 4px; text-align: center;
                 border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .key { font-size: 24px; padding: 18px 0; background: #fff; border: 1px solid #ddd;
         border-radius: 8px; cursor: pointer; }
  .key:active { background: #e8f0fe; }
  .key.fn { font-size: 16px; background: #eee; }
  .confirm { width: 100%; font-size: 20px; padding: 16px; background: #0066cc; color: #fff;
             border: none; border-radius: 8px; cursor: pointer; margin-bottom: 16px; }
  #result { background: #fff; border-radius: 8px; padding: 20px; text-align: center; display: none; }
  #result .badge { display: inline-block; font-size: 22px; font-weight: bold; padding: 8px 20px;
                   border-radius: 20px; margin-bottom: 8px; }
  .badge.in { background: #e6f4ea; color: #1a7f37; }
  .badge.out { background: #e8f0fe; color: #1a56db; }
  #result .name { font-size: 18px; font-weight: bold; }
  #result .time { color: #666; font-size: 14px; margin-top: 4px; }
  #result .err { color: #c5221f; font-size: 15px; }
  .hint { text-align: center; color: #888; font-size: 12px; margin-top: 8px; }

  /* [Phase5-Task4] 모바일 터치 영역 보강 (480px 이하) */
  @media (max-width: 480px) {
    button, .btn { min-height: 44px; }
    input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
    select, textarea { min-height: 44px; font-size: 16px; }
    input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; min-width: 0; flex: none; accent-color: #0066cc; }
  }
</style>
<script defer src="../components/home-navigation.js"></script>
</head>
<body>
<nav aria-label="Feel2Real 홈" style="position:relative;z-index:1;margin:8px 0;"><a data-feel2real-home href="https://feel2real.co.kr/" style="display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:#0066cc;white-space:nowrap;">홈으로</a></nav>
<div class="header">
  <h1>출결 입력</h1>
  <p style="color:#666;font-size:13px;margin-top:4px;">REA 2단계 구현 - ATT-01 · 출석키 입력</p>
</div>

<div class="display">
  <input type="text" id="key-display" placeholder="출석키 입력" autocomplete="off">
  <div class="hint">숫자 키패드로 입력하거나 직접 타이핑 (출석키 = 학생 인증키)</div>
</div>

<div class="keypad" id="keypad"></div>

<button class="confirm" onclick="submitKey()">출결 기록</button>

<div id="result"></div>

<script src="../components/auth.js"></script>
<script src="../components/api-client.js"></script>
<script>
var REA_API_BASE = '/api/rea'; // 학원 경로는 로그인 JWT에서 결정

const display = document.getElementById('key-display');
const pad = document.getElementById('keypad');
['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach(k => {
  const b = document.createElement('button');
  b.className = 'key' + (isNaN(k) ? ' fn' : '');
  b.textContent = k;
  b.onclick = () => {
    if (k === 'C') display.value = '';
    else if (k === '⌫') display.value = display.value.slice(0, -1);
    else display.value += k;
    hideResult();
  };
  pad.appendChild(b);
});

function hideResult() {
  document.getElementById('result').style.display = 'none';
}

async function submitKey() {
  const authKey = display.value.trim();
  const box = document.getElementById('result');
  if (!authKey) {
    box.style.display = 'block';
    box.innerHTML = '<div class="err">출석키를 입력하세요.</div>';
    return;
  }
  try {
    // 학생 출석키 → X-Auth-Key 헤더로 전송 (URL·localStorage에 남기지 않음).
    // body 의 authKey 는 백엔드 KeypadRequest 식별용으로 유지.
    const res = await apiPost(`/@academy/attendance/keypad`, { authKey }, authKey);
    const data = await res.json();
    box.style.display = 'block';
    if (!res.ok) {
      box.innerHTML = `<div class="err">${escapeHtml(data.message || '기록 실패')}</div>`;
      return;
    }
    const isIn = data.eventType === 'CHECK_IN';
    const label = isIn ? '등원' : '하원';
    box.innerHTML = `
      <div class="badge ${isIn ? 'in' : 'out'}">${label} 기록됨</div>
      <div class="name">${escapeHtml(data.studentName)}</div>
      <div class="time">${escapeHtml(data.occurredAt.replace('T', ' '))} · 자동 판별</div>`;
    display.value = '';
  } catch (e) {
    box.style.display = 'block';
    box.innerHTML = '<div class="err">서버 연결 실패</div>';
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
</body>
</html>
