# MySQL 스키마 검증 전용 프로파일 (격리 MySQL 8.x).
# - GitHub Actions 임시 워크플로우(mysql-schema-validation.yml)에서만 사용
# - 시스템 프로퍼티 rea.mysql.validation=true 일 때만 테스트 실행
# - 운영 DB에 절대 사용하지 말 것

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/academycraft?serverTimezone=Asia/Seoul&characterEncoding=utf8mb4&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Flyway V1→V3 적용 + 엔티티 정합성 검증 (운영과 동일)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# 테스트 속도용 (운영값 아님)
rea.security.bcrypt-strength=4
rea.security.expose-reset-token=true
