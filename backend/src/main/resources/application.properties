spring.application.name=rea-academy
server.port=8081

# H2 인메모리 DB (개발용. 운영 DB는 별도 승인 후 연결)
spring.datasource.url=jdbc:h2:mem:rea_academy;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# ===== 정식 로그인 (JWT) 설정 =====
# 운영에서는 REA_JWT_SECRET 환경변수 필수 (256비트 이상). 미설정 시 랜덤 생성(재시작 시 토큰 무효화).
# rea.jwt.secret=
rea.jwt.issuer=academycraft
# Refresh Token 쿠키 Secure 플래그 (HTTPS 운영에서 true)
rea.security.cookie-secure=false
# BCrypt 강도 (테스트에서 낮출 수 있음)
rea.security.bcrypt-strength=12
rea.security.max-login-attempts=5
rea.security.lock-minutes=15
rea.security.password-reset-minutes=30
# 개발 환경에서만 비밀번호 재설정 토큰을 응답에 포함 (운영은 false + SMS/이메일 발송)
rea.security.expose-reset-token=true
