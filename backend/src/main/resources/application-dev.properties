# REA 개발 프로파일 (H2 인메모리). 기본 활성 프로파일.
# 운영 DB 연결은 별도 승인 전까지 금지 — 본 파일은 개발용으로만 유지.

spring.datasource.url=jdbc:h2:mem:rea_academy;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

spring.flyway.enabled=false

# ===== 정식 로그인 (JWT) 설정 (개발) =====
rea.jwt.issuer=academycraft-dev
rea.security.cookie-secure=false
rea.security.bcrypt-strength=4
rea.security.expose-reset-token=true
