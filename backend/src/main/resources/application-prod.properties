# REA 운영 프로파일 (MySQL). **초안 — 실제 값 없음, 전부 환경변수 플레이스홀더**
# 운영 적용 전 별도 승인 필요. 이 파일에 실제 호스트·계정·비밀번호를 절대 기재하지 말 것.
#
# 필수 환경변수:
#   DB_URL            예: jdbc:mysql://<host>:3306/rea_academy?serverTimezone=Asia/Seoul&characterEncoding=utf8mb4
#   DB_USERNAME       운영 DB 계정
#   DB_PASSWORD       운영 DB 비밀번호
#   DB_POOL_SIZE      (선택, 기본 20)
#   REA_AUTHKEY_SECRET 인증키 생성 시크릿 (최소 32바이트 랜덤)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

# 운영에서 스키마 자동 변경 금지. 스키마 변경은 Flyway V파일로만.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# 운영 로그: JSON 권장 (도입 시 logback-spring.xml 추가)
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n

# ===== 정식 로그인 (JWT) 설정 (운영) =====
# REA_JWT_SECRET 환경변수 필수 (256비트 이상 랜덤). 미설정 시起動 실패가 아니라 랜덤 생성되므로
# 배포 체크리스트에서 반드시 확인할 것.
# rea.jwt.secret=${REA_JWT_SECRET}
rea.jwt.issuer=academycraft
rea.security.cookie-secure=true
rea.security.bcrypt-strength=12
# 운영에서는 재설정 토큰을 응답에 포함하지 않음 (SMS·이메일 발송 연동 필요)
rea.security.expose-reset-token=false
